<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechJournal — Dev & Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div>
      <span>TECHJOURNAL</span>
      <div>// dev &amp; games digest</div>
    </div>
    <div>
      <span id="headerDate"></span>
    </div>
  </header>

  <!-- FILTER BAR -->
  <div>
    <span>// FILTER_BY:</span>
    <div id="filterTabs">
      <button data-cat="todas">ALL</button>
      <button data-cat="HTML">HTML</button>
      <button data-cat="JavaScript">JAVASCRIPT</button>
      <button data-cat="Games">GAMES</button>
      <button data-cat="Dinheiro">DINHEIRO</button>
      <button data-cat="Tecnologia">TECNOLOGIA</button>
    </div>
    <span id="postCount">4 posts</span>
  </div>

  <!-- FEATURED POST -->
  <section>
    <h2>// FEATURED_POST</h2>
    <div id="featuredPost"></div>
  </section>

  <!-- POSTS GRID -->
  <section>
    <h2>// LATEST_POSTS</h2>
    <main id="postcard"></main>
  </section>

  <!-- FOOTER -->
  <footer>
    <span>TechJournal © 2025</span>
    <span>Dev &amp; Games</span>
    <span>Built with HTML · CSS · JS</span>
  </footer>

  <script src="JS/data.js"></script>
  <script src="JS/Blog.js"></script>
</body>
</html>
